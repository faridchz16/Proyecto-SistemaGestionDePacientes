spring.application.name=gestion-pacientes
server.port=8081

# ---------- Base de datos ----------
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
# update: crea las tablas nuevas (usuarios, roles, permisos, rol_permiso, historias_clinicas, citas, auditoria)
# y agrega las columnas de auditoría a las tablas existentes sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.time-zone=America/Lima

# ---------- Sesión ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
