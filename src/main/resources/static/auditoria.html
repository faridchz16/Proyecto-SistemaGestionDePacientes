<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría - MedicalSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="cargando">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-wrapper">
    <header class="top-header" id="topHeader"></header>
    <div id="alertContainer"></div>

    <div class="card-panel">
        <div class="card-panel-header"><i class="bi bi-journal-text text-primary"></i> Bitácora de auditoría</div>
        <div class="card-body p-4">
            <div class="row g-2 mb-3">
                <div class="col-md-2"><input id="fUsuario" class="form-control" placeholder="Usuario"></div>
                <div class="col-md-2">
                    <select id="fEntidad" class="form-select">
                        <option value="">Todas las entidades</option>
                        <option>Paciente</option><option>HistoriaClinica</option><option>AtencionResumen</option>
                        <option>Cita</option><option>Usuario</option><option>Rol</option><option>Sesion</option>
                    </select>
                </div>
                <div class="col-md-2"><select id="fOperacion" class="form-select"><option value="">Todas las operaciones</option></select></div>
                <div class="col-md-2"><input type="date" id="fDesde" class="form-control" title="Desde"></div>
                <div class="col-md-2"><input type="date" id="fHasta" class="form-control" title="Hasta"></div>
                <div class="col-md-2 d-grid"><button class="btn btn-primary" onclick="cargar(0)"><i class="bi bi-funnel"></i> Filtrar</button></div>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-striped table-hover border">
                    <thead class="table-dark">
                    <tr><th>#</th><th>Fecha y hora</th><th>Usuario</th><th>Operación</th><th>Entidad</th><th>ID registro</th><th>Detalle</th><th>IP</th></tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <small class="text-muted" id="info"></small>
                <div class="btn-group">
                    <button class="btn btn-outline-secondary btn-sm" id="btnPrev" onclick="cargar(pagina - 1)"><i class="bi bi-chevron-left"></i> Anterior</button>
                    <button class="btn btn-outline-secondary btn-sm" id="btnNext" onclick="cargar(pagina + 1)">Siguiente <i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    let pagina = 0;
    const COLOR = { REGISTRAR: 'success', MODIFICAR: 'warning text-dark', ELIMINAR: 'danger', ACTIVAR: 'info text-dark',
                    DESACTIVAR: 'secondary', LOGIN: 'primary', LOGIN_FALLIDO: 'danger', LOGOUT: 'dark' };

    (async () => {
        const s = await App.iniciarLayout('AUDITORIA', 'Auditoría', 'Registro automático de operaciones del sistema');
        if (!s) return;
        const ops = await App.api('/api/auditoria/operaciones');
        document.getElementById('fOperacion').innerHTML += ops.map(o => `<option>${o}</option>`).join('');
        await cargar(0);
    })();

    async function cargar(p) {
        const q = new URLSearchParams({ page: p, size: 20 });
        const map = { usuario: 'fUsuario', entidad: 'fEntidad', operacion: 'fOperacion', desde: 'fDesde', hasta: 'fHasta' };
        Object.entries(map).forEach(([k, id]) => { const v = document.getElementById(id).value.trim(); if (v) q.set(k, v); });
        try {
            const r = await App.api('/api/auditoria?' + q);
            pagina = r.pagina;
            document.getElementById('tbody').innerHTML = r.contenido.length ? r.contenido.map(a => `
              <tr>
                <td>${a.id}</td>
                <td class="text-nowrap">${App.fechaHora(a.fechaHora)}</td>
                <td class="fw-semibold">${App.esc(a.usuario)}</td>
                <td><span class="badge bg-${COLOR[a.operacion] || 'light'}">${a.operacion}</span></td>
                <td>${App.esc(a.entidad)}</td>
                <td>${a.entidadId ?? '—'}</td>
                <td class="small">${App.esc(a.detalle)}</td>
                <td class="small text-muted">${App.esc(a.ip)}</td>
              </tr>`).join('') : '<tr><td colspan="8" class="text-center text-muted">Sin registros.</td></tr>';
            document.getElementById('info').textContent = `${r.totalRegistros} registros · página ${r.totalPaginas ? r.pagina + 1 : 0} de ${r.totalPaginas}`;
            document.getElementById('btnPrev').disabled = r.pagina <= 0;
            document.getElementById('btnNext').disabled = r.pagina + 1 >= r.totalPaginas;
        } catch (e) { App.alerta(e.message, 'danger'); }
    }
</script>
</body>
</html>
