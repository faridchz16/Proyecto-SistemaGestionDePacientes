<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historias clínicas - MedicalSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="cargando">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-wrapper">
    <header class="top-header" id="topHeader"></header>
    <div id="alertContainer"></div>

    <div class="card-panel">
        <div class="card-panel-header"><i class="bi bi-search text-primary"></i> Seleccionar paciente</div>
        <div class="card-body p-4">
            <div class="row g-2">
                <div class="col-md-8">
                    <input type="search" id="q" class="form-control" placeholder="N° de documento o nombre del paciente" onkeydown="if(event.key==='Enter') buscar()">
                </div>
                <div class="col-md-4 d-grid">
                    <button class="btn btn-primary fw-semibold" onclick="buscar()"><i class="bi bi-search"></i> Buscar</button>
                </div>
            </div>
            <div id="resultados" class="list-group mt-3"></div>
        </div>
    </div>

    <div id="detalle" style="display:none">
        <div class="card-panel">
            <div class="card-panel-header justify-content-between">
                <span><i class="bi bi-journal-medical text-info"></i> Historia clínica
                    <span class="badge bg-primary ms-1" id="numHistoria"></span></span>
                <small class="text-muted fw-normal" id="auditHistoria"></small>
            </div>
            <div class="card-body p-4">
                <div class="p-3 bg-light border rounded-3 mb-3">
                    <h5 class="fw-bold text-primary mb-1" id="pNombre"></h5>
                    <span class="me-3"><b>Documento:</b> <span id="pDoc"></span></span>
                    <span class="me-3"><b>Nacimiento:</b> <span id="pNac"></span></span>
                    <span><b>Sexo:</b> <span id="pSexo"></span></span>
                </div>
                <div id="sinHistoria" class="alert alert-info" style="display:none">
                    <i class="bi bi-info-circle"></i> El paciente aún no tiene historia clínica. Complete los datos y presione <b>Aperturar historia</b>.
                </div>
                <form id="formHistoria" onsubmit="guardarHistoria(event)">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Grupo sanguíneo</label>
                            <select id="grupoSanguineo" class="form-select">
                                <option value="">No registrado</option>
                                <option>O+</option><option>O-</option><option>A+</option><option>A-</option>
                                <option>B+</option><option>B-</option><option>AB+</option><option>AB-</option>
                            </select>
                        </div>
                        <div class="col-md-9">
                            <label class="form-label fw-semibold">Alergias</label>
                            <input id="alergias" class="form-control" maxlength="500" placeholder="Ej. Penicilina">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Antecedentes personales</label>
                            <textarea id="antecedentesPersonales" class="form-control" rows="3" maxlength="1000"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Antecedentes familiares</label>
                            <textarea id="antecedentesFamiliares" class="form-control" rows="3" maxlength="1000"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Observaciones</label>
                            <textarea id="observaciones" class="form-control" rows="2" maxlength="1000"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-green mt-3" id="btnHistoria">Guardar historia</button>
                </form>
            </div>
        </div>

        <div class="card-panel">
            <div class="card-panel-header justify-content-between">
                <span><i class="bi bi-clipboard2-pulse text-success"></i> Atenciones médicas del paciente</span>
                <button class="btn btn-sm btn-green" onclick="abrirAtencion()"><i class="bi bi-plus-circle"></i> Registrar atención</button>
            </div>
            <div class="card-body p-4">
                <div class="table-responsive">
                    <table class="table table-striped table-hover border">
                        <thead class="table-dark">
                        <tr><th>Fecha</th><th>Especialidad</th><th>Médico</th><th>Diagnóstico / Observación</th><th>Registrado por</th><th class="text-center">Acciones</th></tr>
                        </thead>
                        <tbody id="tbodyAtenciones"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="modalAtencion" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form onsubmit="guardarAtencion(event)">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="tituloAtencion">Registrar atención</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="alertModal"></div>
                    <input type="hidden" id="atencionId">
                    <div class="mb-3"><label class="form-label fw-semibold">Fecha *</label><input type="date" id="aFecha" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Especialidad *</label><input id="aEspecialidad" class="form-control" required></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Médico tratante</label><input id="aMedico" class="form-control"></div>
                    <div class="mb-3"><label class="form-label fw-semibold">Diagnóstico / Observación</label><textarea id="aDiagnostico" class="form-control" rows="3" maxlength="1000"></textarea></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    let sesion, paciente = null, historia = null, atenciones = [], modal;
    const CAMPOS_H = ['grupoSanguineo', 'alergias', 'antecedentesPersonales', 'antecedentesFamiliares', 'observaciones'];

    (async () => {
        sesion = await App.iniciarLayout('HISTORIAS', 'Historias Clínicas', 'Historia clínica (1 a 1) y atenciones (1 a N) del paciente');
        if (!sesion) return;
        modal = new bootstrap.Modal(document.getElementById('modalAtencion'));
    })();

    async function buscar() {
        const q = document.getElementById('q').value.trim();
        if (!q) return App.alerta('Ingrese un documento o nombre.', 'warning');
        try {
            const lista = await App.api('/api/pacientes?q=' + encodeURIComponent(q));
            document.getElementById('resultados').innerHTML = lista.length
                ? lista.map(p => `<button type="button" class="list-group-item list-group-item-action" onclick="seleccionar(${p.id})">
                     <b>${App.esc(p.numeroDocumento)}</b> — ${App.esc(p.apellidoPaterno)} ${App.esc(p.apellidoMaterno)}, ${App.esc(p.nombres)}
                     ${p.estado === 'INACTIVO' ? '<span class="badge bg-secondary">INACTIVO</span>' : ''}</button>`).join('')
                : '<div class="text-muted">Sin resultados.</div>';
        } catch (e) { App.alerta(e.message, 'danger'); }
    }

    async function seleccionar(id) {
        try {
            paciente = await App.api(`/api/pacientes/${id}`);
            historia = await App.api(`/api/historias/paciente/${id}`);   // null si responde 204
            document.getElementById('resultados').innerHTML = '';
            document.getElementById('pNombre').textContent = `${paciente.nombres} ${paciente.apellidoPaterno} ${paciente.apellidoMaterno}`;
            document.getElementById('pDoc').textContent = `${paciente.tipoDocumento} ${paciente.numeroDocumento}`;
            document.getElementById('pNac').textContent = paciente.fechaNacimiento || '—';
            document.getElementById('pSexo').textContent = paciente.sexo || '—';
            pintarHistoria();
            await cargarAtenciones();
            document.getElementById('detalle').style.display = 'block';
        } catch (e) { App.alerta(e.message, 'danger'); }
    }

    function pintarHistoria() {
        document.getElementById('formHistoria').reset();
        document.getElementById('sinHistoria').style.display = historia ? 'none' : 'block';
        document.getElementById('numHistoria').textContent = historia ? historia.numeroHistoria : 'SIN APERTURAR';
        document.getElementById('btnHistoria').textContent = historia ? 'Guardar cambios' : 'Aperturar historia';
        document.getElementById('auditHistoria').textContent = historia
            ? `Abierta el ${historia.fechaApertura} por ${historia.creadoPor}` +
              (historia.modificadoPor ? ` · Última modificación: ${historia.modificadoPor} (${App.fechaHora(historia.fechaModificacion)})` : '')
            : '';
        if (historia) CAMPOS_H.forEach(c => document.getElementById(c).value = historia[c] || '');
    }

    async function guardarHistoria(ev) {
        ev.preventDefault();
        const datos = {};
        CAMPOS_H.forEach(c => datos[c] = document.getElementById(c).value.trim());
        try {
            historia = await App.api(`/api/historias/paciente/${paciente.id}`, { method: historia ? 'PUT' : 'POST', body: datos });
            pintarHistoria();
            App.alerta('Historia clínica guardada correctamente.');
        } catch (e) { App.alerta(e.message, 'danger'); }
    }

    async function cargarAtenciones() {
        atenciones = await App.api(`/api/pacientes/${paciente.id}/atenciones`);
        const tbody = document.getElementById('tbodyAtenciones');
        tbody.innerHTML = atenciones.length ? atenciones.map((a, i) => `
          <tr>
            <td>${App.esc(a.fechaAtencion)}</td>
            <td><span class="badge bg-secondary">${App.esc(a.especialidad)}</span></td>
            <td>${App.esc(a.medico)}</td>
            <td class="text-pre">${App.esc(a.diagnostico) || '<span class="text-muted small">Sin diagnóstico</span>'}</td>
            <td class="small">${App.esc(a.creadoPor || '—')}</td>
            <td class="text-center text-nowrap">
              <button class="btn btn-sm btn-outline-warning" title="Editar" onclick="abrirAtencion(${i})"><i class="bi bi-pencil-square"></i></button>
              <button class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="eliminarAtencion(${a.id})"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`).join('')
          : '<tr><td colspan="6" class="text-center text-muted">No hay atenciones registradas.</td></tr>';
    }

    function abrirAtencion(i) {
        const a = i === undefined ? null : atenciones[i];
        document.getElementById('alertModal').innerHTML = '';
        document.getElementById('tituloAtencion').textContent = a ? 'Editar atención' : 'Registrar atención';
        document.getElementById('atencionId').value = a ? a.id : '';
        document.getElementById('aFecha').value = a ? a.fechaAtencion : new Date().toISOString().slice(0, 10);
        document.getElementById('aEspecialidad').value = a ? a.especialidad : '';
        document.getElementById('aMedico').value = a ? (a.medico || '') : sesion.nombreCompleto;
        document.getElementById('aDiagnostico').value = a ? (a.diagnostico || '') : '';
        modal.show();
    }

    async function guardarAtencion(ev) {
        ev.preventDefault();
        const id = document.getElementById('atencionId').value;
        const datos = {
            fechaAtencion: document.getElementById('aFecha').value,
            especialidad: document.getElementById('aEspecialidad').value.trim(),
            medico: document.getElementById('aMedico').value.trim(),
            diagnostico: document.getElementById('aDiagnostico').value.trim()
        };
        try {
            await App.api(`/api/pacientes/${paciente.id}/atenciones` + (id ? `/${id}` : ''), { method: id ? 'PUT' : 'POST', body: datos });
            modal.hide();
            App.alerta(id ? 'Atención actualizada.' : 'Atención registrada.');
            await cargarAtenciones();
        } catch (e) { App.alerta(e.message, 'danger', 'alertModal'); }
    }

    async function eliminarAtencion(id) {
        if (!confirm('¿Eliminar esta atención? La operación quedará registrada en la auditoría.')) return;
        try {
            await App.api(`/api/pacientes/${paciente.id}/atenciones/${id}`, { method: 'DELETE' });
            App.alerta('Atención eliminada.');
            await cargarAtenciones();
        } catch (e) { App.alerta(e.message, 'danger'); }
    }
</script>
</body>
</html>
