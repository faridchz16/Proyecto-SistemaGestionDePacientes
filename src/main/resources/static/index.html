<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - MedicalSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="cargando">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-wrapper">
    <header class="top-header" id="topHeader"></header>
    <div id="alertContainer"></div>
    <div class="card-panel">
        <div class="card-panel-header"><i class="bi bi-grid text-primary"></i> Módulos disponibles para su rol</div>
        <div class="card-body p-4">
            <div class="row g-3" id="modulos"></div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    (async () => {
        const s = await App.iniciarLayout(null, 'Inicio', 'Bienvenido(a) al sistema');
        if (!s) return;
        document.getElementById('modulos').innerHTML = s.modulos.map(m => `
            <div class="col-sm-6 col-lg-4">
              <a href="${m.ruta}" class="text-decoration-none">
                <div class="border rounded-3 p-4 h-100 bg-light">
                  <i class="bi ${App.esc(m.icono)} text-primary fs-2"></i>
                  <h6 class="fw-bold text-dark mt-2 mb-0">${App.esc(m.nombre)}</h6>
                </div>
              </a>
            </div>`).join('');
    })();
</script>
</body>
</html>
