<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - MedicalSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
    body {
        min-height: 100vh;
        background: url('/img/Login.jpeg') center/cover no-repeat fixed;
        font-family: Arial, sans-serif;
    }
    .login-card {
    max-width: 400px;
    width: 100%;
    border: none;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}
    .brand { color: #0f172a; font-weight: 800; font-size: 2.2rem; line-height: 1.1; }
    .brand span { color: #2563eb; }

    .input-group-text { background: #fff; color: #94a3b8; border-right: 0; }
    .input-group .form-control { border-left: 0; }
    .input-group .form-control:focus { box-shadow: none; }
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control { border-color: #86b7fe; }

    .btn-primary { background: #1d63ed; border: none; border-radius: 8px; }

    .alert-success { background: #e8f5ec; border-color: #bfe3cb; color: #15803d; }
</style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<div class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <svg width="56" height="56" viewBox="0 0 48 48" class="mb-2">
                <polygon points="14,2 34,2 34,14 46,14 46,34 34,34 34,46 14,46 14,34 2,34 2,14 14,14"
                         fill="#2563eb" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
                <polyline points="7,24 16,24 20,16 26,32 30,24 41,24"
                          fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="brand">Medical<span>Sys</span></div>
            <small class="text-muted">Sistema de Gestión de Pacientes</small>
        </div>

        <div id="mensaje"></div>

        <form method="post" action="/login" id="formLogin">
            <input type="hidden" name="_csrf" id="csrf">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold py-2">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar
            </button>
        </form>
    </div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    const msg = document.getElementById('mensaje');
    if (params.get('error') === 'inactivo') {
        msg.innerHTML = '<div class="alert alert-warning py-2">Su usuario o su rol se encuentran <b>desactivados</b>. Contacte al administrador.</div>';
    } else if (params.has('error')) {
        msg.innerHTML = '<div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>';
    } else if (params.has('logout')) {
        msg.innerHTML = '<div class="alert alert-success py-2">Sesión cerrada correctamente.</div>';
    } else if (params.has('expirada')) {
        msg.innerHTML = '<div class="alert alert-info py-2">Su sesión expiró. Ingrese nuevamente.</div>';
    }
    // El backend envía el token CSRF en la cookie XSRF-TOKEN; se copia al formulario antes de enviarlo
    document.getElementById('formLogin').addEventListener('submit', () => {
        const m = document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/);
        document.getElementById('csrf').value = m ? decodeURIComponent(m[1]) : '';
    });
</script>
</body>
</html>
