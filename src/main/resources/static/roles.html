<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - MedicalSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="cargando">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-wrapper">
    <header class="top-header" id="topHeader"></header>
    <div id="alertContainer"></div>

    <div class="card-panel">
        <div class="card-panel-header justify-content-between">
            <span><i class="bi bi-shield-lock-fill text-primary"></i> Listado de roles</span>
            <button class="btn btn-green" onclick="abrirNuevo()"><i class="bi bi-plus-circle"></i> Nuevo rol</button>
        </div>
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-striped table-hover border">
                    <thead class="table-dark">
                    <tr><th>ID</th><th>Rol</th><th>Descripción</th><th>Módulos permitidos</th><th class="text-center">Usuarios</th>
                        <th>Estado</th><th class="text-center">Acciones</th></tr>
                    </thead>
                    <tbody id="tbodyRoles"></tbody>
                </table>
            </div>
            <p class="small text-muted mb-0"><i class="bi bi-info-circle"></i>
                Los cambios de módulos se aplican a los usuarios en su próximo inicio de sesión.
                Un rol inactivo impide el ingreso de todos sus usuarios.</p>
        </div>
    </div>
</main>

<div class="modal fade" id="modalRol" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="formRol" onsubmit="guardar(event)" novalidate>
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="tituloModal">Registrar rol</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="alertModal"></div>
                    <input type="hidden" id="rolId">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del rol *</label>
                        <input type="text" id="nombre" class="form-control text-uppercase" required minlength="3" maxlength="40">
                        <div class="form-text">Se guarda en mayúsculas y sin tildes (ej. "Enfermera" → ENFERMERA).</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea id="descripcion" class="form-control" rows="2" maxlength="200"></textarea>
                    </div>
                    <label class="form-label fw-semibold">Módulos a los que tiene acceso *</label>
                    <div id="listaPermisos" class="border rounded p-3"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    let roles = [], permisos = [], modal;

    (async () => {
        const s = await App.iniciarLayout('ROLES', 'Gestión de Roles', 'Registrar, editar, activar/desactivar y asignar módulos');
        if (!s) return;
        modal = new bootstrap.Modal(document.getElementById('modalRol'));
        permisos = await App.api('/api/permisos');
        await cargarRoles();
    })();

    async function cargarRoles() {
        try {
            roles = await App.api('/api/roles');
            document.getElementById('tbodyRoles').innerHTML = roles.map(r => `
              <tr>
                <td>${r.id}</td>
                <td class="fw-bold">${App.esc(r.nombre)}</td>
                <td class="small">${App.esc(r.descripcion)}</td>
                <td>${r.permisos.map(p => `<span class="badge bg-light text-dark border me-1"><i class="bi ${App.esc(p.icono)}"></i> ${App.esc(p.nombre)}</span>`).join('')}</td>
                <td class="text-center">${r.cantidadUsuarios}</td>
                <td>${r.activo ? '<span class="badge bg-success">ACTIVO</span>' : '<span class="badge bg-secondary">INACTIVO</span>'}</td>
                <td class="text-center text-nowrap">
                  <button class="btn btn-sm btn-outline-primary" title="Editar" onclick="abrirEditar(${r.id})"><i class="bi bi-pencil-square"></i></button>
                  ${r.activo
                    ? `<button class="btn btn-sm btn-outline-danger" title="Desactivar" ${r.nombre === 'ADMINISTRADOR' ? 'disabled' : ''} onclick="cambiarEstado(${r.id}, false)"><i class="bi bi-toggle-on"></i></button>`
                    : `<button class="btn btn-sm btn-outline-success" title="Activar" onclick="cambiarEstado(${r.id}, true)"><i class="bi bi-toggle-off"></i></button>`}
                </td>
              </tr>`).join('');
        } catch (e) { App.alerta(e.message, 'danger'); }
    }

    function pintarPermisos(seleccionados) {
        document.getElementById('listaPermisos').innerHTML = permisos.map(p => `
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="${p.id}" id="perm${p.id}" ${seleccionados.includes(p.id) ? 'checked' : ''}>
            <label class="form-check-label" for="perm${p.id}"><i class="bi ${App.esc(p.icono)}"></i> ${App.esc(p.nombre)}
              <small class="text-muted">(${App.esc(p.codigo)})</small></label>
          </div>`).join('');
    }

    function abrirNuevo() {
        const f = document.getElementById('formRol');
        f.reset(); f.classList.remove('was-validated');
        document.getElementById('alertModal').innerHTML = '';
        document.getElementById('rolId').value = '';
        document.getElementById('nombre').readOnly = false;
        document.getElementById('tituloModal').textContent = 'Registrar rol';
        pintarPermisos([]);
        modal.show();
    }

    function abrirEditar(id) {
        const r = roles.find(x => x.id === id);
        abrirNuevo();
        document.getElementById('tituloModal').textContent = `Editar rol: ${r.nombre}`;
        document.getElementById('rolId').value = r.id;
        document.getElementById('nombre').value = r.nombre;
        document.getElementById('nombre').readOnly = r.nombre === 'ADMINISTRADOR';
        document.getElementById('descripcion').value = r.descripcion || '';
        pintarPermisos(r.permisos.map(p => p.id));
    }

    async function guardar(ev) {
        ev.preventDefault();
        const f = ev.target;
        f.classList.add('was-validated');
        if (!f.checkValidity()) return;
        const permisoIds = [...document.querySelectorAll('#listaPermisos input:checked')].map(c => Number(c.value));
        if (!permisoIds.length) return App.alerta('Seleccione al menos un módulo.', 'warning', 'alertModal');

        const id = document.getElementById('rolId').value;
        const datos = {
            nombre: document.getElementById('nombre').value.trim(),
            descripcion: document.getElementById('descripcion').value.trim(),
            permisoIds
        };
        try {
            await App.api(id ? `/api/roles/${id}` : '/api/roles', { method: id ? 'PUT' : 'POST', body: datos });
            modal.hide();
            App.alerta(id ? 'Rol actualizado correctamente.' : 'Rol registrado correctamente.');
            await cargarRoles();
        } catch (e) { App.alerta(e.message, 'danger', 'alertModal'); }
    }

    async function cambiarEstado(id, activo) {
        const r = roles.find(x => x.id === id);
        const aviso = !activo && r.cantidadUsuarios ? `\n\n${r.cantidadUsuarios} usuario(s) con este rol no podrán ingresar.` : '';
        if (!confirm(`¿Desea ${activo ? 'activar' : 'desactivar'} el rol ${r.nombre}?${aviso}`)) return;
        try {
            await App.api(`/api/roles/${id}/estado?activo=${activo}`, { method: 'PATCH' });
            App.alerta(`Rol ${r.nombre} ${activo ? 'activado' : 'desactivado'}.`);
            await cargarRoles();
        } catch (e) { App.alerta(e.message, 'danger'); }
    }
</script>
</body>
</html>
