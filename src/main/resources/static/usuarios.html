<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - MedicalSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</head>
<body class="cargando">
<aside class="sidebar" id="sidebar"></aside>
<main class="main-wrapper">
    <header class="top-header" id="topHeader"></header>
    <div id="alertContainer"></div>

    <div class="card-panel">
        <div class="card-panel-header justify-content-between">
            <span><i class="bi bi-people-fill text-primary"></i> Listado de usuarios</span>
            <button class="btn btn-green" onclick="abrirNuevo()"><i class="bi bi-person-plus-fill"></i> Nuevo usuario</button>
        </div>
        <div class="card-body p-4">
            <div class="row g-2 mb-3">
                <div class="col-md-6">
                    <input type="search" id="filtroTexto" class="form-control" placeholder="Buscar por usuario, nombre o correo" oninput="renderizar()">
                </div>
                <div class="col-md-3">
                    <select id="filtroRol" class="form-select" onchange="renderizar()"><option value="">Todos los roles</option></select>
                </div>
                <div class="col-md-3">
                    <select id="filtroEstado" class="form-select" onchange="renderizar()">
                        <option value="">Todos los estados</option>
                        <option value="true">Activos</option>
                        <option value="false">Inactivos</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover border">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th><th>Usuario</th><th>Nombre completo</th><th>Correo</th><th>Rol</th>
                        <th>Estado</th><th>Último acceso</th><th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tbodyUsuarios"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <form id="formUsuario" onsubmit="guardar(event)" novalidate>
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="tituloModal">Registrar usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="alertModal"></div>
                    <input type="hidden" id="usuarioId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Usuario *</label>
                            <input type="text" id="username" class="form-control" required minlength="4" maxlength="50" pattern="[a-zA-Z0-9._\-]+">
                            <div class="form-text">Mínimo 4 caracteres, sin espacios.</div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Rol *</label>
                            <select id="rolId" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombres *</label>
                            <input type="text" id="nombres" class="form-control" required maxlength="80">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellidos *</label>
                            <input type="text" id="apellidos" class="form-control" required maxlength="80">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Correo *</label>
                            <input type="email" id="email" class="form-control" required maxlength="100">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" id="lblPassword">Contraseña *</label>
                            <input type="password" id="password" class="form-control" minlength="8" maxlength="64" autocomplete="new-password">
                            <div class="form-text" id="ayudaPassword">Mínimo 8 caracteres, con letras y números.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary fw-bold" id="btnGuardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script>
    let usuarios = [], roles = [], sesion = null, modal;

    (async () => {
        sesion = await App.iniciarLayout('USUARIOS', 'Gestión de Usuarios', 'Registrar, editar, activar/desactivar y asignar roles');
        if (!sesion) return;
        modal = new bootstrap.Modal(document.getElementById('modalUsuario'));
        await Promise.all([cargarRoles(), cargarUsuarios()]);
    })();

    async function cargarRoles() {
        roles = await App.api('/api/roles');
        document.getElementById('filtroRol').innerHTML = '<option value="">Todos los roles</option>' +
            roles.map(r => `<option value="${r.id}">${App.esc(r.nombre)}</option>`).join('');
    }

    async function cargarUsuarios() {
        try {
            usuarios = await App.api('/api/usuarios');
            renderizar();
        } catch (e) { App.alerta(e.message, 'danger'); }
    }

    function renderizar() {
        const txt = document.getElementById('filtroTexto').value.toLowerCase();
        const rol = document.getElementById('filtroRol').value;
        const est = document.getElementById('filtroEstado').value;
        const lista = usuarios.filter(u =>
            (!txt || `${u.username} ${u.nombres} ${u.apellidos} ${u.email}`.toLowerCase().includes(txt)) &&
            (!rol || String(u.rolId) === rol) &&
            (!est || String(u.activo) === est));

        const tbody = document.getElementById('tbodyUsuarios');
        if (!lista.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No hay usuarios que coincidan.</td></tr>';
            return;
        }
        tbody.innerHTML = lista.map(u => {
            const yo = u.username === sesion.username;
            return `<tr>
              <td>${u.id}</td>
              <td class="fw-semibold">${App.esc(u.username)} ${yo ? '<span class="badge bg-info">usted</span>' : ''}</td>
              <td>${App.esc(u.nombres)} ${App.esc(u.apellidos)}</td>
              <td>${App.esc(u.email)}</td>
              <td><span class="badge badge-rol">${App.esc(u.rolNombre)}</span>
                  ${u.rolActivo ? '' : '<span class="badge bg-warning text-dark" title="Rol inactivo">rol inactivo</span>'}</td>
              <td>${u.activo ? '<span class="badge bg-success">ACTIVO</span>' : '<span class="badge bg-secondary">INACTIVO</span>'}</td>
              <td class="small">${App.fechaHora(u.ultimoAcceso) || '<span class="text-muted">Nunca</span>'}</td>
              <td class="text-center text-nowrap">
                <button class="btn btn-sm btn-outline-primary" title="Editar" onclick="abrirEditar(${u.id})"><i class="bi bi-pencil-square"></i></button>
                ${u.activo
                  ? `<button class="btn btn-sm btn-outline-danger" title="Desactivar" ${yo ? 'disabled' : ''} onclick="cambiarEstado(${u.id}, false)"><i class="bi bi-person-x"></i></button>`
                  : `<button class="btn btn-sm btn-outline-success" title="Activar" onclick="cambiarEstado(${u.id}, true)"><i class="bi bi-person-check"></i></button>`}
              </td></tr>`;
        }).join('');
    }

    function llenarComboRoles(rolActualId) {
        // Solo roles activos (o el rol actual del usuario, para no perderlo al editar)
        document.getElementById('rolId').innerHTML = '<option value="" disabled selected>Seleccione un rol</option>' +
            roles.filter(r => r.activo || r.id === rolActualId)
                 .map(r => `<option value="${r.id}">${App.esc(r.nombre)}${r.activo ? '' : ' (inactivo)'}</option>`).join('');
    }

    function abrirNuevo() {
        document.getElementById('formUsuario').reset();
        document.getElementById('formUsuario').classList.remove('was-validated');
        document.getElementById('alertModal').innerHTML = '';
        document.getElementById('usuarioId').value = '';
        document.getElementById('rolId').disabled = false;
        document.getElementById('tituloModal').textContent = 'Registrar usuario';
        document.getElementById('lblPassword').textContent = 'Contraseña *';
        document.getElementById('password').required = true;
        document.getElementById('ayudaPassword').textContent = 'Mínimo 8 caracteres, con letras y números.';
        llenarComboRoles(null);
        modal.show();
    }

    function abrirEditar(id) {
        const u = usuarios.find(x => x.id === id);
        abrirNuevo();
        document.getElementById('tituloModal').textContent = `Editar usuario: ${u.username}`;
        document.getElementById('usuarioId').value = u.id;
        document.getElementById('username').value = u.username;
        document.getElementById('nombres').value = u.nombres;
        document.getElementById('apellidos').value = u.apellidos;
        document.getElementById('email').value = u.email;
        llenarComboRoles(u.rolId);
        document.getElementById('rolId').value = u.rolId;
        document.getElementById('rolId').disabled = u.username === sesion.username;
        document.getElementById('lblPassword').textContent = 'Nueva contraseña';
        document.getElementById('password').required = false;
        document.getElementById('ayudaPassword').textContent = 'Déjelo vacío para conservar la contraseña actual.';
    }

    async function guardar(ev) {
        ev.preventDefault();
        const form = ev.target;
        form.classList.add('was-validated');
        if (!form.checkValidity()) return;

        const id = document.getElementById('usuarioId').value;
        const datos = {
            username: document.getElementById('username').value.trim(),
            nombres: document.getElementById('nombres').value.trim(),
            apellidos: document.getElementById('apellidos').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            rolId: Number(document.getElementById('rolId').value)
        };
        try {
            await App.api(id ? `/api/usuarios/${id}` : '/api/usuarios', { method: id ? 'PUT' : 'POST', body: datos });
            modal.hide();
            document.getElementById('rolId').disabled = false;
            App.alerta(id ? 'Usuario actualizado correctamente.' : 'Usuario registrado correctamente.');
            await cargarUsuarios();
        } catch (e) {
            App.alerta(e.message, 'danger', 'alertModal');
        }
    }

    async function cambiarEstado(id, activo) {
        const u = usuarios.find(x => x.id === id);
        if (!confirm(`¿Desea ${activo ? 'activar' : 'desactivar'} al usuario ${u.username}?`)) return;
        try {
            await App.api(`/api/usuarios/${id}/estado?activo=${activo}`, { method: 'PATCH' });
            App.alerta(`Usuario ${u.username} ${activo ? 'activado' : 'desactivado'}.`);
            await cargarUsuarios();
        } catch (e) { App.alerta(e.message, 'danger'); }
    }
</script>
</body>
</html>
